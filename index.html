<link rel="preload" href="assets/fonts/cormorantgaramond-300.woff2" as="font" type="font/woff2" crossorigin>

<link rel="stylesheet" href="assets/css/base.css">

<body>

<a class="skip-link" href="#main">Skip to content</a>

<header class="app-header" id="app-header" hidden>
  <button class="hdr-btn" id="hdr-back" type="button" aria-label="Go back">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <span class="hdr-title" id="hdr-title"></span>
  <a class="hdr-btn" id="hdr-photos" href="#/photos" aria-label="All photos">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
  </a>
</header>

<main id="main" tabindex="-1">
  <!-- The hero is inline so it paints as the LCP before the router boots.
       home.js progressively enhances it; if JS never runs, this still reads. -->
  <section class="hero" id="hero">
    <img class="hero-img" src="assets/gallery/photos/t-53.webp"
         srcset="assets/gallery/thumbs/t-53.webp 640w, assets/gallery/photos/t-53.webp 1600w"
         sizes="100vw" alt="Nadav and Sharon on their wedding day"
         fetchpriority="high" decoding="sync" width="6854" height="4569">
    <div class="hero-scrim" aria-hidden="true"></div>
    <div class="hero-content">
      <p class="hero-eyebrow">10 July 2026</p>
      <h1 class="hero-names">Sharon <em>&amp;</em> Nadav</h1>
      <div class="hero-rule" aria-hidden="true"></div>
      <a class="cta" id="hero-cta" href="#/people">
        <svg class="cta-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="9" cy="9" r="3.6"/><path d="M2.6 19.2c.7-3.2 3.3-5 6.4-5s5.7 1.8 6.4 5"/>
          <circle cx="16.6" cy="7.4" r="2.7"/><path d="M15.2 13.1c2.7-.5 5.3 1.1 6 4.2"/>
        </svg>
        <span id="hero-cta-label">Find My Photos</span>
      </a>
      <a class="hero-alt" href="#/photos">or browse all the photos <span aria-hidden="true">→</span></a>
    </div>
  </section>
</main>

<noscript>
  <div class="noscript">
    <h2>This gallery needs JavaScript</h2>
    <p>Please enable JavaScript to search the photos by face. In the meantime you can
       open the photos directly:</p>
    <p id="noscript-links"></p>
  </div>
</noscript>

<div class="sr-live" id="sr-live" aria-live="polite" aria-atomic="true"></div>

<script type="module" src="assets/js/app.js"></script>
</body>
</html>
